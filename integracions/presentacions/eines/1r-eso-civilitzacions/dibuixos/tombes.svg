<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="Roboto, Arial, sans-serif">
  <rect width="1200" height="470" fill="#F6F8FB"/>
  <!-- terra comuna -->
  <rect x="0" y="300" width="1200" height="170" fill="#EFE3C8"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#9A9486" stroke-width="3"/>
  <!-- separacions -->
  <g stroke="#DADCE0" stroke-width="2"><line x1="300" y1="30" x2="300" y2="440"/><line x1="600" y1="30" x2="600" y2="440"/><line x1="900" y1="30" x2="900" y2="440"/></g>

  <!-- 1. Mastaba -->
  <g>
    <circle cx="40" cy="48" r="20" fill="#188038"/><text x="40" y="56" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="72" y="56" font-size="25" font-weight="700" fill="#202124">Mastaba</text>
    <text x="150" y="92" font-size="18" fill="#5F6368" text-anchor="middle">Nobles i alts funcionaris</text>
    <polygon points="70,300 230,300 214,236 86,236" fill="#E3DED2" stroke="#9A9486" stroke-width="3"/>
    <!-- pou i cambra -->
    <rect x="146" y="300" width="10" height="72" fill="#C9B99A" stroke="#9A9486" stroke-width="2"/>
    <rect x="126" y="372" width="54" height="34" fill="#FFFFFF" stroke="#188038" stroke-width="3"/>
    <text x="150" y="440" font-size="17" fill="#5F6368" text-anchor="middle">Cambra sota terra</text>
  </g>

  <!-- 2. Piràmide esglaonada -->
  <g>
    <circle cx="340" cy="48" r="20" fill="#188038"/><text x="340" y="56" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="372" y="56" font-size="25" font-weight="700" fill="#202124">Esglaonada</text>
    <text x="450" y="92" font-size="18" fill="#5F6368" text-anchor="middle">Djoser, cap al 2650 aC</text>
    <g fill="#E3DED2" stroke="#9A9486" stroke-width="3">
      <polygon points="345,300 555,300 545,272 355,272"/>
      <polygon points="362,272 538,272 528,244 372,244"/>
      <polygon points="379,244 521,244 511,216 389,216"/>
      <polygon points="396,216 504,216 494,188 406,188"/>
      <polygon points="413,188 487,188 477,160 423,160"/>
      <polygon points="430,160 470,160 462,132 438,132"/>
    </g>
    <text x="450" y="440" font-size="17" fill="#5F6368" text-anchor="middle">Sis graons, com mastabes</text>
    <text x="450" y="462" font-size="17" fill="#5F6368" text-anchor="middle">una sobre l'altra</text>
  </g>

  <!-- 3. Piràmide de cares llises -->
  <g>
    <circle cx="640" cy="48" r="20" fill="#188038"/><text x="640" y="56" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="672" y="56" font-size="25" font-weight="700" fill="#202124">Piràmide</text>
    <text x="750" y="92" font-size="18" fill="#5F6368" text-anchor="middle">Gizeh, cap al 2500 aC</text>
    <polygon points="640,300 860,300 750,118" fill="#E3DED2" stroke="#9A9486" stroke-width="3"/>
    <polygon points="750,118 860,300 790,300" fill="#D3CBB9"/>
    <polygon points="640,300 860,300 750,118" fill="none" stroke="#9A9486" stroke-width="3"/>
    <!-- passadís i cambra -->
    <path d="M708,250 L750,222" stroke="#C9B99A" stroke-width="7"/>
    <rect x="740" y="206" width="34" height="22" fill="#FFFFFF" stroke="#188038" stroke-width="3"/>
    <text x="750" y="440" font-size="17" fill="#5F6368" text-anchor="middle">Cambra a dins</text>
    <text x="750" y="462" font-size="17" fill="#5F6368" text-anchor="middle">Molt visible per als lladres</text>
  </g>

  <!-- 4. Hipogeu -->
  <g>
    <circle cx="940" cy="48" r="20" fill="#188038"/><text x="940" y="56" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="972" y="56" font-size="25" font-weight="700" fill="#202124">Hipogeu</text>
    <text x="1050" y="92" font-size="18" fill="#5F6368" text-anchor="middle">Vall dels Reis, Imperi Nou</text>
    <!-- muntanya -->
    <path d="M905,300 L960,190 L1010,230 L1070,140 L1140,250 L1195,300 Z" fill="#E3DED2" stroke="#9A9486" stroke-width="3"/>
    <!-- entrada i passadís sota terra -->
    <rect x="1000" y="282" width="18" height="18" fill="#5F6368"/>
    <path d="M1009,300 L1009,330 L1080,370" fill="none" stroke="#C9B99A" stroke-width="10" stroke-linejoin="round"/>
    <rect x="1070" y="356" width="64" height="40" fill="#FFFFFF" stroke="#188038" stroke-width="3"/>
    <text x="1050" y="440" font-size="17" fill="#5F6368" text-anchor="middle">Excavat a la roca,</text>
    <text x="1050" y="462" font-size="17" fill="#5F6368" text-anchor="middle">amagat sota terra</text>
  </g>
  <text x="1192" y="22" font-size="14" fill="#80868B" text-anchor="end">Esquema sense escala</text>
</svg>
