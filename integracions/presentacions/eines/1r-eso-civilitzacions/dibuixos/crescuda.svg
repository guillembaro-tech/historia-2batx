<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" font-family="Roboto, Arial, sans-serif">
  <defs>
    <!-- Perfil del terreny: desert a dalt, plana al costat del riu i llit del riu al mig -->
    <path id="terra" d="M0,250 L70,250 C110,250 115,320 160,320 L235,320 C250,320 252,392 300,392 C348,392 350,320 365,320 L440,320 C485,320 490,250 530,250 L590,250 L590,470 L0,470 Z"/>
    <g id="espiga">
      <line x1="0" y1="0" x2="0" y2="-34" stroke="#3E8E52" stroke-width="3"/>
      <ellipse cx="0" cy="-40" rx="5" ry="10" fill="#C9A227"/>
      <line x1="0" y1="-14" x2="-9" y2="-24" stroke="#3E8E52" stroke-width="2.5"/>
    </g>
    <g id="duna"><path d="M0,0 Q14,-12 28,0" fill="none" stroke="#C9B99A" stroke-width="2.5"/></g>
  </defs>
  <rect width="1200" height="450" fill="#F6F8FB"/>

  <!-- ============ Panell 1. La crescuda ============ -->
  <g transform="translate(0,40)">
    <circle cx="34" cy="10" r="22" fill="#188038"/>
    <text x="34" y="18" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="70" y="18" font-size="28" font-weight="700" fill="#202124">La crescuda</text>
    <text x="70" y="52" font-size="21" fill="#5F6368">Cada any el riu creix i inunda les ribes.</text>
    <g transform="translate(0,-95)">
      <use href="#terra" fill="#E3DED2" stroke="#9A9486" stroke-width="3"/>
      <!-- desert -->
      <rect x="0" y="246" width="66" height="10" fill="#F1E3C2"/>
      <rect x="532" y="246" width="58" height="10" fill="#F1E3C2"/>
      <!-- aigua de la crescuda -->
      <path d="M118,288 L482,288 C486,300 488,312 440,320 L365,320 C350,320 348,392 300,392 C252,392 250,320 235,320 L160,320 C120,316 116,300 118,288 Z" fill="#9CC3F0" opacity="0.85"/>
      <path d="M118,288 L482,288" stroke="#2A6FD6" stroke-width="3" stroke-dasharray="10 8"/>
      <path d="M235,320 C250,320 252,392 300,392 C348,392 350,320 365,320 Z" fill="#2A6FD6"/>
      <!-- fletxes de l'aigua que surt -->
      <g fill="none" stroke="#174A96" stroke-width="4" stroke-linecap="round">
        <path d="M262,300 L190,300"/><path d="M200,290 L188,300 L200,310"/>
        <path d="M338,300 L410,300"/><path d="M400,290 L412,300 L400,310"/>
      </g>
      <!-- etiquetes -->
      <text x="300" y="440" font-size="22" font-weight="700" fill="#202124" text-anchor="middle">Riu</text>
      <line x1="300" y1="420" x2="300" y2="396" stroke="#5F6368" stroke-width="2"/>
      <text x="300" y="270" font-size="21" fill="#174A96" text-anchor="middle" font-weight="700">Nivell de l'aigua</text>
      <text x="34" y="232" font-size="21" fill="#8A6D3B" text-anchor="middle" font-weight="700">Desert</text>
      <text x="560" y="232" font-size="21" fill="#8A6D3B" text-anchor="middle" font-weight="700">Desert</text>
    </g>
  </g>

  <!-- separació -->
  <line x1="600" y1="40" x2="600" y2="420" stroke="#DADCE0" stroke-width="2"/>

  <!-- ============ Panell 2. Després de la crescuda ============ -->
  <g transform="translate(610,40)">
    <circle cx="34" cy="10" r="22" fill="#188038"/>
    <text x="34" y="18" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="70" y="18" font-size="28" font-weight="700" fill="#202124">Quan l'aigua baixa</text>
    <text x="70" y="52" font-size="21" fill="#5F6368">Queden els llims, i amb canals es rega.</text>
    <g transform="translate(0,-95)">
      <use href="#terra" fill="#E3DED2" stroke="#9A9486" stroke-width="3"/>
      <rect x="0" y="246" width="66" height="10" fill="#F1E3C2"/>
      <rect x="532" y="246" width="58" height="10" fill="#F1E3C2"/>
      <!-- llims -->
      <path d="M150,318 L235,318 L238,330 L148,330 Z" fill="#7A5A3A"/>
      <path d="M365,318 L450,318 L452,330 L362,330 Z" fill="#7A5A3A"/>
      <!-- riu al seu llit -->
      <path d="M248,350 L352,350 C346,380 330,392 300,392 C270,392 254,380 248,350 Z" fill="#2A6FD6"/>
      <!-- canal de regadiu -->
      <path d="M190,318 L190,334 L206,334 L206,318" fill="#9CC3F0" stroke="#174A96" stroke-width="2.5"/>
      <!-- espigues -->
      <use href="#espiga" x="160" y="318"/><use href="#espiga" x="176" y="318"/><use href="#espiga" x="220" y="318"/><use href="#espiga" x="232" y="318"/>
      <use href="#espiga" x="372" y="318"/><use href="#espiga" x="388" y="318"/><use href="#espiga" x="404" y="318"/><use href="#espiga" x="420" y="318"/><use href="#espiga" x="436" y="318"/>
      <!-- etiquetes -->
      <text x="300" y="440" font-size="22" font-weight="700" fill="#202124" text-anchor="middle">Riu</text>
      <line x1="300" y1="420" x2="300" y2="396" stroke="#5F6368" stroke-width="2"/>
      <text x="408" y="420" font-size="22" font-weight="700" fill="#5A3E22" text-anchor="middle">Llims</text>
      <line x1="408" y1="400" x2="408" y2="332" stroke="#5F6368" stroke-width="2"/>
      <text x="408" y="446" font-size="19" fill="#5F6368" text-anchor="middle">(fang fèrtil)</text>
      <text x="196" y="420" font-size="22" font-weight="700" fill="#174A96" text-anchor="middle">Canal</text>
      <line x1="198" y1="400" x2="198" y2="338" stroke="#5F6368" stroke-width="2"/>
      <text x="300" y="250" font-size="22" font-weight="700" fill="#3E8E52" text-anchor="middle">Camps de cultiu</text>
      <line x1="236" y1="258" x2="212" y2="272" stroke="#5F6368" stroke-width="2"/>
      <line x1="364" y1="258" x2="388" y2="272" stroke="#5F6368" stroke-width="2"/>
      <text x="34" y="232" font-size="21" fill="#8A6D3B" text-anchor="middle" font-weight="700">Desert</text>
      <text x="560" y="232" font-size="21" fill="#8A6D3B" text-anchor="middle" font-weight="700">Desert</text>
    </g>
  </g>
  <text x="1190" y="440" font-size="15" fill="#80868B" text-anchor="end">Esquema sense escala</text>
</svg>
