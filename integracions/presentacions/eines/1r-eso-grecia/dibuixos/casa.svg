<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Roboto, Arial, sans-serif">
  <rect width="1000" height="760" fill="#F6F8FB"/>
  <!-- carrer -->
  <rect x="0" y="660" width="1000" height="100" fill="#E8EDF2"/>
  <text x="500" y="725" font-size="34" fill="#80868B" text-anchor="middle" letter-spacing="8">CARRER</text>
  <!-- casa -->
  <rect x="150" y="60" width="700" height="580" fill="#FFFFFF" stroke="#202124" stroke-width="14"/>
  <!-- pati -->
  <rect x="370" y="230" width="260" height="230" fill="#E6F4EA"/>
  <!-- murs interiors -->
  <g stroke="#202124" stroke-width="8" fill="none">
    <path d="M150,230 L330,230 M410,230 L590,230 M670,230 L850,230"/>
    <path d="M370,60 L370,230 M630,60 L630,230"/>
    <path d="M370,230 L370,300 M370,380 L370,555 M370,615 L370,640"/>
    <path d="M630,230 L630,300 M630,380 L630,555 M630,615 L630,640"/>
    <path d="M370,460 L460,460 M540,460 L630,460"/>
    <path d="M150,440 L370,440 M630,440 L850,440"/>
  </g>
  <!-- porta del carrer -->
  <rect x="455" y="630" width="90" height="22" fill="#FFFFFF"/>
  <path d="M455,640 L545,640" stroke="#188038" stroke-width="4" stroke-dasharray="8 6"/>
  <!-- llits de banquet a l'andró -->
  <g fill="#F2C7B2" stroke="#5F6368" stroke-width="2.5">
    <rect x="170" y="460" width="34" height="80" rx="6"/><rect x="170" y="550" width="34" height="70" rx="6"/>
    <rect x="215" y="595" width="80" height="30" rx="6"/><rect x="300" y="595" width="55" height="30" rx="6"/>
  </g>
  <!-- teler al pati -->
  <g stroke="#188038" stroke-width="3" fill="none">
    <rect x="540" y="260" width="60" height="70"/><line x1="550" y1="262" x2="550" y2="328"/><line x1="560" y1="262" x2="560" y2="328"/><line x1="570" y1="262" x2="570" y2="328"/><line x1="580" y1="262" x2="580" y2="328"/><line x1="590" y1="262" x2="590" y2="328"/>
  </g>
  <!-- escala -->
  <g stroke="#5F6368" stroke-width="2.5" fill="#F1F3F4">
    <rect x="785" y="465" width="55" height="160"/>
    <line x1="785" y1="492" x2="840" y2="492"/><line x1="785" y1="519" x2="840" y2="519"/><line x1="785" y1="546" x2="840" y2="546"/><line x1="785" y1="573" x2="840" y2="573"/><line x1="785" y1="600" x2="840" y2="600"/>
  </g>
  <g text-anchor="middle">
    <text x="500" y="392" font-size="44" font-weight="700" fill="#188038">Pati</text>
    <text x="500" y="430" font-size="25" fill="#188038">llum, aire i feina</text>
    <text x="285" y="512" font-size="34" font-weight="700" fill="#202124">Andró</text>
    <text x="285" y="546" font-size="24" fill="#5F6368">banquets</text>
    <text x="260" y="155" font-size="30" font-weight="700" fill="#5F6368">Habitació</text>
    <text x="500" y="155" font-size="30" font-weight="700" fill="#5F6368">Habitació</text>
    <text x="740" y="155" font-size="30" font-weight="700" fill="#5F6368">Habitació</text>
    <text x="260" y="345" font-size="30" font-weight="700" fill="#5F6368">Habitació</text>
    <text x="740" y="345" font-size="30" font-weight="700" fill="#5F6368">Habitació</text>
    <text x="705" y="520" font-size="28" font-weight="700" fill="#202124">Escala</text>
    <text x="705" y="552" font-size="21" fill="#5F6368">pis de dalt</text>
    <text x="705" y="578" font-size="21" fill="#5F6368">(gineceu)</text>
    <text x="500" y="565" font-size="28" font-weight="700" fill="#5F6368">Entrada</text>
    <text x="570" y="356" font-size="20" fill="#188038">teler</text>
  </g>
</svg>
